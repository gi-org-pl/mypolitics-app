name: e2e

# The end-to-end suite does not run on pull requests: authors run it locally
# (AGENTS.md 4.6). Here it runs once a day on the default branch, in all three
# browsers, and can be started by hand on any branch from the Actions tab.
on:
  schedule:
    # 02:17 UTC every day. Not on the hour: GitHub delays runs queued then.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      report_failure:
        description: "Open or update the failure issue if this run does not pass (a scheduled run always does)"
        type: boolean
        default: false

permissions:
  contents: read

# A group per trigger: a run started by hand never cancels the scheduled one,
# nor the other way round. A newer run of the same kind replaces the older.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # A scheduled run is skipped when the last scheduled run that succeeded
      # was on this very commit, so a day without a commit costs one short job.
      # A skipped run succeeds too, which keeps the skip going until a commit
      # arrives; a failed run never counts, so a broken commit is tried again.
      - name: Decide whether the suite has to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml \
            --event schedule --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')

          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No commit since the last scheduled run that succeeded ($GITHUB_SHA): skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The suite itself runs in gi-org-pl/frontend-workflows (docs/ci/CI.md):
  # all three browsers, the Playwright configuration builds the app and
  # serves the build, and the report is uploaded when the run fails. Its time
  # limits are on the steps - a step that runs out of time fails, so the job
  # ends as a failure and is reported like one - with 25 minutes for the tests.
  e2e:
    name: Test E2E
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    # A full commit SHA, like frontend-ci in build-frontend.yml.
    uses: gi-org-pl/frontend-workflows/.github/workflows/frontend-e2e.yml@29abab77b99adfdf42027db9865463b86fda4d95 # pre-release, frontend-workflows#13
    with:
      install_args: --network-concurrency 1
      timeout_minutes: 25

  # Reports every way a scheduled run can end without the suite having passed:
  # the preflight did not succeed (the suite is then skipped), a scenario
  # failed, or the suite ran out of time (its step fails then, see above). A
  # run that was skipped on purpose is not reported. Neither is a run that
  # somebody cancelled, which `cancelled()` sees.
  report:
    name: Report a failure
    needs: [changes, e2e]
    if: >-
      ${{
        !cancelled() &&
        (github.event_name == 'schedule' || inputs.report_failure) &&
        (needs.changes.result != 'success' ||
          (needs.e2e.result != 'success' && needs.e2e.result != 'skipped'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # One open issue at a time: a failure while it is open adds a comment.
      # The workflow never closes it - a person does, after the fix.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: e2e-nightly
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PREFLIGHT_RESULT: ${{ needs.changes.result }}
          SUITE_RESULT: ${{ needs.e2e.result }}
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The scheduled e2e run did not pass" 2>/dev/null || true

          body="The e2e run did not pass on \`$GITHUB_REF_NAME\` at [\`${GITHUB_SHA::7}\`]($COMMIT_URL) (trigger: $GITHUB_EVENT_NAME).

          - Jobs: preflight \`$PREFLIGHT_RESULT\`, suite \`$SUITE_RESULT\`. On the suite, \`failure\` is a failed scenario or the 25 minute limit of the test step, and \`skipped\` means the preflight did not get that far.
          - Run: $RUN_URL
          - Playwright report: the \`playwright-report\` artifact of that run, kept for 7 days (there is none when the suite did not start).

          Reproduce locally with \`CI=1 yarn e2e\`. Close this issue once \`main\` passes again."

          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // ""')

          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "The scheduled e2e run did not pass" --body "$body"
          fi
