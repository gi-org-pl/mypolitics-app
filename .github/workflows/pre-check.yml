name: pre-check

# AI pre-check of every pull request that is ready for review: an isolated
# reviewer reads the diff against gi-tech-standards and this repository's
# AGENTS.md, comments on real findings and posts one "Pre-check" summary of
# the technical decisions. The workflow, the reviewer's instructions and the
# process live in gi-tech-standards (docs/process/PRE_CHECK.md). Until the
# organisation secret CLAUDE_CODE_OAUTH_TOKEN exists, every run is skipped.
on:
  pull_request:
    # edited: the description carries the design comparison the reviewer
    # checks, so a changed description is reviewed again (see the job's if).
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Ends green at once; keeps a required pre-check from blocking a merge queue.
  merge_group:

permissions: {}

jobs:
  pre-check:
    name: pre-check
    # Only an edit of the description counts, not of the title or the base.
    # Skipped here, the run leaves the last pre-check / review result alone.
    if: github.event.action != 'edited' || github.event.changes.body != null
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: gi-org-pl/gi-tech-standards/.github/workflows/pre-check.yml@ci/pre-check
    with:
      standards_ref: ci/pre-check
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
